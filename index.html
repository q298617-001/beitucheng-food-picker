    <style>
:root {
  color-scheme: light;
  font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: #211a17;
  background: #f4ecdf;
  --paper: #fffaf1;
  --ink: #211a17;
  --muted: #776b63;
  --line: #d8c9b8;
  --red: #b52d25;
  --red-dark: #842019;
  --gold: #e4b463;
  --green: #35624d;
  --shadow: 0 18px 50px rgba(72, 42, 24, 0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background:
    radial-gradient(circle at 12% 0%, rgba(228, 180, 99, 0.22), transparent 30rem),
    linear-gradient(180deg, #f7f0e5 0%, #f0e4d3 100%);
}

button,
input,
select {
  font: inherit;
}

button,
select {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

.shell {
  width: min(980px, calc(100% - 32px));
  margin: 0 auto;
  padding: 24px 0 32px;
}

.top-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
}

.data-state {
  margin-right: auto;
  color: var(--green);
  font-size: 13px;
  font-weight: 700;
}

.nav-button {
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 9px 14px;
  color: var(--muted);
  background: transparent;
  font-size: 14px;
  font-weight: 700;
}

.nav-button:hover,
.nav-button.active {
  border-color: var(--line);
  color: var(--ink);
  background: rgba(255, 250, 241, 0.9);
}

.view {
  animation: appear 220ms ease-out;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero,
.library-header {
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(129, 91, 60, 0.22);
  border-radius: 28px;
  padding: 48px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(255, 248, 236, 0.95)),
    var(--paper);
  box-shadow: var(--shadow);
}

.hero::after,
.library-header::after {
  content: "食";
  position: absolute;
  right: 24px;
  bottom: -54px;
  color: rgba(181, 45, 37, 0.07);
  font-family: serif;
  font-size: 190px;
  font-weight: 900;
  line-height: 1;
  pointer-events: none;
}

.eyebrow {
  margin: 0 0 12px;
  color: var(--red);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

h1,
h2,
p {
  margin-top: 0;
}

.hero h1,
.library-header h1 {
  position: relative;
  z-index: 1;
  margin-bottom: 12px;
  font-family: "Songti SC", STSong, serif;
  font-size: clamp(44px, 8vw, 82px);
  line-height: 0.98;
  letter-spacing: -0.06em;
}

.hero > p:not(.eyebrow),
.library-header > p:not(.eyebrow) {
  max-width: 630px;
  margin-bottom: 22px;
  color: var(--muted);
  font-size: 17px;
  line-height: 1.7;
}

.address-line {
  display: inline-flex;
  position: relative;
  z-index: 1;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 10px 15px;
  color: #5d4c41;
  background: rgba(255, 255, 255, 0.68);
  font-size: 13px;
}

.mode-panel {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 18px 0 12px;
}

.mode-button {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  min-height: 86px;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px 20px;
  color: var(--ink);
  background: rgba(255, 250, 241, 0.78);
  text-align: left;
  transition: 160ms ease;
}

.mode-button strong {
  font-size: 18px;
}

.mode-button span {
  color: var(--muted);
  font-size: 13px;
}

.mode-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(72, 42, 24, 0.08);
}

.mode-button.active {
  border-color: var(--red-dark);
  color: #fff;
  background: linear-gradient(135deg, var(--red), var(--red-dark));
}

.mode-button.active span {
  color: rgba(255, 255, 255, 0.76);
}

.distance-control {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 13px 16px;
  background: rgba(255, 250, 241, 0.72);
  font-weight: 800;
}

.distance-control small {
  margin-left: 6px;
  color: var(--muted);
  font-weight: 400;
}

select,
input[type="search"] {
  border: 1px solid var(--line);
  border-radius: 12px;
  outline: none;
  color: var(--ink);
  background: #fffdf9;
}

select {
  padding: 9px 34px 9px 12px;
}

select:focus,
input[type="search"]:focus {
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(181, 45, 37, 0.1);
}

.result-card {
  min-height: 286px;
  margin-top: 12px;
  border: 1px solid rgba(127, 79, 40, 0.24);
  border-radius: 24px;
  padding: 22px;
  background: var(--paper);
  box-shadow: var(--shadow);
}

.result-topline {
  display: flex;
  justify-content: space-between;
  margin-bottom: 28px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.12em;
}

.empty-state,
.result-content {
  display: grid;
  grid-template-columns: 88px 1fr;
  align-items: center;
  gap: 24px;
  min-height: 178px;
}

.food-mark {
  display: grid;
  place-items: center;
  width: 88px;
  height: 88px;
  border-radius: 28px;
  background: #f1dfc7;
  font-size: 42px;
}

.empty-state strong {
  font-family: "Songti SC", STSong, serif;
  font-size: 27px;
}

.empty-state p {
  margin: 8px 0 0;
  color: var(--muted);
}

.result-copy h2 {
  margin-bottom: 8px;
  font-family: "Songti SC", STSong, serif;
  font-size: clamp(28px, 5vw, 44px);
  line-height: 1.15;
}

.result-tier,
.recommendation {
  margin-bottom: 8px;
  color: var(--muted);
}

.result-tier {
  color: var(--red);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.16em;
}

.tags,
.row-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.tags span,
.row-meta span {
  border-radius: 999px;
  padding: 5px 9px;
  color: #675448;
  background: #f2e5d5;
  font-size: 12px;
  font-weight: 700;
}

.restaurant-address {
  margin: 14px 0 8px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.55;
}

.map-link,
.row-link {
  color: var(--red);
  font-weight: 800;
  text-decoration: none;
}

.map-link:hover,
.row-link:hover {
  text-decoration: underline;
}

.draw-button,
.show-more {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  border: 0;
  border-radius: 18px;
  padding: 18px 22px;
  color: #fff;
  background: linear-gradient(135deg, var(--red), var(--red-dark));
  font-size: 17px;
  font-weight: 900;
  box-shadow: 0 12px 28px rgba(132, 32, 25, 0.24);
  transition: 160ms ease;
}

.draw-button {
  margin-top: 12px;
}

.draw-button:hover:not(:disabled),
.show-more:hover {
  transform: translateY(-2px);
}

.draw-button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.library-header {
  padding-bottom: 38px;
}

.library-header h1 {
  font-size: clamp(42px, 7vw, 68px);
}

.library-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.library-stats span {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 12px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.62);
  font-size: 12px;
}

.library-stats strong {
  color: var(--ink);
}

.library-toolbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 150px 130px;
  gap: 10px;
  margin: 18px 0 12px;
}

input[type="search"] {
  width: 100%;
  padding: 13px 15px;
}

.list-heading {
  display: flex;
  justify-content: space-between;
  padding: 12px 4px;
  color: var(--muted);
  font-size: 13px;
}

.list-heading strong {
  color: var(--ink);
}

.restaurant-list {
  display: grid;
  gap: 8px;
}

.restaurant-row {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) auto;
  align-items: center;
  gap: 18px;
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 17px 18px;
  background: rgba(255, 250, 241, 0.82);
}

.restaurant-index {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 14px;
  color: var(--red);
  background: #f2dfc7;
  font-size: 12px;
  font-weight: 900;
}

.restaurant-main h2 {
  margin-bottom: 4px;
  font-size: 18px;
}

.restaurant-main > p {
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 13px;
}

.restaurant-main .row-address {
  margin-bottom: 10px;
  line-height: 1.5;
}

.row-link {
  white-space: nowrap;
}

.show-more {
  justify-content: center;
  max-width: 280px;
  margin: 18px auto 0;
  padding: 14px 20px;
}

footer {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 24px 4px 0;
  color: var(--muted);
  font-size: 12px;
}

@media (max-width: 680px) {
  .shell {
    width: min(100% - 20px, 980px);
    padding-top: 12px;
  }

  .top-nav {
    flex-wrap: wrap;
  }

  .data-state {
    width: 100%;
    margin-bottom: 2px;
  }

  .nav-button {
    flex: 1;
  }

  .hero,
  .library-header {
    border-radius: 22px;
    padding: 30px 22px;
  }

  .hero h1,
  .library-header h1 {
    font-size: 46px;
  }

  .address-line {
    border-radius: 14px;
    line-height: 1.5;
  }

  .mode-panel {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .mode-button {
    min-height: 70px;
    padding: 14px 17px;
  }

  .distance-control {
    align-items: flex-start;
  }

  .distance-control > span {
    display: grid;
    gap: 2px;
  }

  .distance-control small {
    margin-left: 0;
  }

  .result-card {
    min-height: 330px;
  }

  .empty-state,
  .result-content {
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .food-mark {
    width: 72px;
    height: 72px;
    border-radius: 22px;
    font-size: 34px;
  }

  .library-toolbar {
    grid-template-columns: 1fr 1fr;
  }

  .library-toolbar input {
    grid-column: 1 / -1;
  }

  .restaurant-row {
    grid-template-columns: 42px minmax(0, 1fr);
    align-items: start;
    gap: 12px;
    padding: 15px;
  }

  .restaurant-index {
    width: 38px;
    height: 38px;
  }

  .row-link {
    grid-column: 2;
  }

  footer {
    flex-direction: column;
    gap: 6px;
  }
}

    <script>
const DAILY_MAX = 40;
const FEAST_MIN = 100;
const PAGE_SIZE = 100;

const state = {
  restaurants: [],
  mode: "all",
  maxDistance: 3000,
  selected: null,
  visibleLimit: PAGE_SIZE,
  meta: null,
};

const elements = {
  views: document.querySelectorAll(".view"),
  navButtons: document.querySelectorAll("[data-view]"),
  modeButtons: document.querySelectorAll("[data-mode]"),
  pickerDistance: document.querySelector("#picker-distance"),
  candidateCount: document.querySelector("#candidate-count"),
  result: document.querySelector("#result-content"),
  draw: document.querySelector("#draw-button"),
  activeCount: document.querySelector("#active-count"),
  dailyCount: document.querySelector("#daily-count"),
  updatedAt: document.querySelector("#updated-at"),
  search: document.querySelector("#search-input"),
  libraryMode: document.querySelector("#library-mode"),
  libraryDistance: document.querySelector("#library-distance"),
  libraryCount: document.querySelector("#library-count"),
  list: document.querySelector("#restaurant-list"),
  showMore: document.querySelector("#show-more"),
};

function matchesMode(restaurant, mode) {
  if (mode === "daily") return restaurant.avgCost > 0 && restaurant.avgCost <= DAILY_MAX;
  if (mode === "feast") return restaurant.avgCost >= FEAST_MIN;
  if (mode === "unknown") return restaurant.avgCost == null || restaurant.avgCost <= 0;
  return true;
}

function pickerPool() {
  return state.restaurants.filter((restaurant) => matchesMode(restaurant, state.mode) && restaurant.distanceM <= state.maxDistance);
}

function formatDistance(distance) {
  return distance < 1000 ? `${distance} m` : `${(distance / 1000).toFixed(1)} km`;
}

function mapUrl(restaurant) {
  const keyword = encodeURIComponent(`${restaurant.name} ${restaurant.address}`);
  return `https://uri.amap.com/search?keyword=${keyword}&city=北京&callnative=0`;
}

function renderPicker() {
  const pool = pickerPool();
  elements.candidateCount.textContent = `${pool.length} 家候选`;
  elements.draw.disabled = pool.length === 0;

  if (!state.selected) {
    elements.result.className = "empty-state";
    elements.result.replaceChildren(createElement("span", "food-mark", pool.length ? "🍲" : "🗂️"), createTextBlock(pool.length ? "把选择困难交给运气" : "当前条件暂无餐馆", pool.length ? "选择模式和距离后开始抽签" : "请放宽距离或切换用餐模式"));
    return;
  }

  const restaurant = state.selected;
  const wrapper = createElement("div", "result-content");
  wrapper.append(createElement("div", "food-mark", restaurant.avgCost > 0 && restaurant.avgCost <= DAILY_MAX ? "🥢" : "🍲"));
  const copy = createElement("div", "result-copy");
  copy.append(createElement("p", "result-tier", "餐馆数据快照"), createElement("h2", "", restaurant.name), createElement("p", "recommendation", restaurant.category || "餐饮服务"));
  const tags = createElement("div", "tags");
  tags.append(createElement("span", "", restaurant.avgCost > 0 ? `约 ¥${restaurant.avgCost}/人` : "人均待核查"), createElement("span", "", formatDistance(restaurant.distanceM)));
  if (restaurant.rating != null) tags.append(createElement("span", "", `评分 ${restaurant.rating}`));
  const address = createElement("p", "restaurant-address", `⌖ ${restaurant.address}`);
  const link = createElement("a", "map-link", "去高德确认营业并导航 ↗");
  link.href = mapUrl(restaurant);
  link.target = "_blank";
  link.rel = "noreferrer";
  copy.append(tags, address, link);
  wrapper.append(copy);
  elements.result.className = "";
  elements.result.replaceChildren(wrapper);
}

function drawRestaurant() {
  const pool = pickerPool();
  if (!pool.length) return;
  state.selected = pool[Math.floor(Math.random() * pool.length)];
  elements.draw.querySelector("span").textContent = "再抽一次";
  renderPicker();
}

function filteredLibrary() {
  const query = elements.search.value.trim().toLowerCase();
  const mode = elements.libraryMode.value;
  const distance = Number(elements.libraryDistance.value);
  return state.restaurants.filter((restaurant) => {
    if (restaurant.distanceM > distance || !matchesMode(restaurant, mode)) return false;
    return !query || `${restaurant.name} ${restaurant.address} ${restaurant.category}`.toLowerCase().includes(query);
  });
}

function renderLibrary() {
  const filtered = filteredLibrary();
  const visible = filtered.slice(0, state.visibleLimit);
  const fragment = document.createDocumentFragment();
  for (const [index, restaurant] of visible.entries()) {
    const row = createElement("article", "restaurant-row");
    row.append(createElement("div", "restaurant-index", String(index + 1).padStart(2, "0")));
    const main = createElement("div", "restaurant-main");
    main.append(createElement("h2", "", restaurant.name), createElement("p", "", restaurant.category || "餐饮服务"), createElement("p", "row-address", `⌖ ${restaurant.address}`));
    const meta = createElement("div", "row-meta");
    meta.append(createElement("span", "", formatDistance(restaurant.distanceM)), createElement("span", "", restaurant.avgCost > 0 ? `约 ¥${restaurant.avgCost}/人` : "人均待核查"));
    if (restaurant.rating != null) meta.append(createElement("span", "", `评分 ${restaurant.rating}`));
    main.append(meta);
    const link = createElement("a", "row-link", "高德核对 ↗");
    link.href = mapUrl(restaurant);
    link.target = "_blank";
    link.rel = "noreferrer";
    row.append(main, link);
    fragment.append(row);
  }
  elements.list.replaceChildren(fragment);
  elements.libraryCount.textContent = `${filtered.length} 家`;
  elements.showMore.classList.toggle("hidden", visible.length >= filtered.length);
}

function createElement(tag, className = "", text = "") {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text) element.textContent = text;
  return element;
}

function createTextBlock(title, description) {
  const block = document.createElement("div");
  block.append(createElement("strong", "", title), createElement("p", "", description));
  return block;
}

function switchView(view) {
  elements.views.forEach((item) => item.classList.toggle("hidden", item.id !== `${view}-view`));
  elements.navButtons.forEach((button) => button.classList.toggle("active", button.dataset.view === view));
  if (view === "library") renderLibrary();
  window.location.hash = view === "library" ? "restaurants" : "";
}

function bindEvents() {
  elements.navButtons.forEach((button) => button.addEventListener("click", () => switchView(button.dataset.view)));
  elements.modeButtons.forEach((button) => button.addEventListener("click", () => {
    state.mode = button.dataset.mode;
    state.selected = null;
    elements.draw.querySelector("span").textContent = "今天就吃这个";
    elements.modeButtons.forEach((item) => item.classList.toggle("active", item === button));
    renderPicker();
  }));
  elements.pickerDistance.addEventListener("change", () => {
    state.maxDistance = Number(elements.pickerDistance.value);
    state.selected = null;
    elements.draw.querySelector("span").textContent = "今天就吃这个";
    renderPicker();
  });
  elements.draw.addEventListener("click", drawRestaurant);
  for (const control of [elements.search, elements.libraryMode, elements.libraryDistance]) {
    control.addEventListener("input", () => { state.visibleLimit = PAGE_SIZE; renderLibrary(); });
  }
  elements.showMore.addEventListener("click", () => { state.visibleLimit += PAGE_SIZE; renderLibrary(); });
}

async function init() {
  bindEvents();
  try {
    const dataElement = document.querySelector("#restaurant-data");
    if (!dataElement) throw new Error("餐馆数据缺失");
    const payload = JSON.parse(dataElement.textContent);
    if (!Array.isArray(payload.restaurants)) throw new Error("餐馆数据格式无效");
    state.restaurants = payload.restaurants.filter((restaurant) => restaurant.isActive !== false && restaurant.distanceM <= 3000).sort((a, b) => a.distanceM - b.distanceM || a.name.localeCompare(b.name, "zh-CN"));
    state.meta = payload;
    elements.activeCount.textContent = String(state.restaurants.length);
    elements.dailyCount.textContent = String(state.restaurants.filter((restaurant) => matchesMode(restaurant, "daily")).length);
    elements.updatedAt.textContent = payload.generatedAt ? new Date(payload.generatedAt).toLocaleDateString("zh-CN") : "当前快照";
    renderPicker();
    if (window.location.hash === "#restaurants") switchView("library");
  } catch (error) {
    elements.candidateCount.textContent = "读取失败";
    elements.result.replaceChildren(createTextBlock("餐馆数据暂不可用", error instanceof Error ? error.message : "请稍后重试"));
  }
}

init();

    </script>
  </body>
</html>
